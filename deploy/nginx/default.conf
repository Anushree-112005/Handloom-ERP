server {
    listen 80;
    server_name _;

    # -------------------------------------------------------------------------
    # Security Headers
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;

    # Hide Nginx version
    server_tokens off;

    # -------------------------------------------------------------------------
    # Cloudflare Real IP Handling
    # -------------------------------------------------------------------------
    # Since traffic goes Cloudflare -> Cloudflared -> Caddy -> Nginx,
    # the real client IP is usually in CF-Connecting-IP or X-Forwarded-For.
    # Nginx's real_ip module can extract this if configured correctly, but using
    # standard headers is usually sufficient for application logging.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

    # -------------------------------------------------------------------------
    # Upload Limits
    # -------------------------------------------------------------------------
    # Adjust this based on maximum expected file upload size (e.g. for ERP documents)
    client_max_body_size 50M;

    # -------------------------------------------------------------------------
    # Routing - Backend API
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        
        # Timeout settings for long-running backend processes (like PDF generation)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # WebSocket support (if needed by FastAPI/Uvicorn)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -------------------------------------------------------------------------
    # Routing - Backend Uploads (Static Files Served by FastAPI or Nginx directly)
    # -------------------------------------------------------------------------
    # The application serves uploads from /uploads via FastAPI. We proxy it directly.
    location /uploads/ {
        proxy_pass http://backend:8000;
        
        # Cache static uploads aggressively
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # -------------------------------------------------------------------------
    # Routing - Frontend Application
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend:80;
        
        # SPA Routing support (handled internally by frontend nginx, but good practice)
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}
