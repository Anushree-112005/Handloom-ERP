version: '3.8'

services:
  # -----------------------------------------------------------------------------
  # Cloudflare Tunnel - Exposes Caddy securely to the internet
  # -----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - app_network
    depends_on:
      - caddy

  # -----------------------------------------------------------------------------
  # Caddy - Initial internal reverse proxy (handles Cloudflare traffic -> Nginx)
  # -----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - app_network
    depends_on:
      - nginx

  # -----------------------------------------------------------------------------
  # Nginx - Main API Gateway & Security Hub
  # -----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx_gateway
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network
    depends_on:
      - frontend
      - backend

  # -----------------------------------------------------------------------------
  # Frontend Application
  # -----------------------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:-dinesh-tex-frontend:latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    networks:
      - app_network

  # -----------------------------------------------------------------------------
  # Backend Application (FastAPI)
  # -----------------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-dinesh-tex-backend:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - PROJECT_NAME=${PROJECT_NAME:-"Dinesh Textile ERP"}
      - API_V1_STR=${API_V1_STR:-"/api/v1"}
      - FRONTEND_URL=${FRONTEND_URL}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    volumes:
      # Persist uploaded files on the host system
      - app_uploads:/app/uploads
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy

  # -----------------------------------------------------------------------------
  # PostgreSQL Database
  # -----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
  app_uploads:
