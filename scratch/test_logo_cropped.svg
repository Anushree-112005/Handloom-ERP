<svg width="240" height="160" viewBox="0 0 260 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Pink Top-Left Parallelogram -->
  <polygon points="0,0 80,0 40,80" fill="#ec4899"/>
  <polygon points="80,0 120,80 40,80" fill="#db2777"/>

  <!-- Green Bottom-Left Parallelogram -->
  <polygon points="40,80 120,80 80,160" fill="#84cc16"/>
  <polygon points="120,80 160,160 80,160" fill="#bef264"/>

  <!-- Orange Top-Right Parallelogram -->
  <polygon points="100,20 180,20 140,100" fill="#fb923c"/>
  <polygon points="180,20 220,100 140,100" fill="#ea580c"/>

  <!-- Blue Bottom-Right Parallelogram -->
  <polygon points="140,100 220,100 180,180" fill="#0e7490"/>
  <polygon points="220,100 260,180 180,180" fill="#0f172a"/>
</svg>
