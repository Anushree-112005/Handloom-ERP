<svg width="240" height="160" viewBox="0 0 350 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Left Half: Pink and Green (Shifted Up and Left) -->
  <g transform="translate(10, 10)">
    <!-- Pink Top-Left Parallelogram -->
    <!-- Triangle Pointing Up (Bright Pink / Magenta) -->
    <polygon points="40,0 120,0 80,80" fill="#ec4899"/>
    <!-- Triangle Pointing Down (Darker Pink) -->
    <polygon points="120,0 160,80 80,80" fill="#db2777"/>

    <!-- Green Bottom-Left Parallelogram -->
    <!-- Triangle Pointing Up (Bright Lime Green) -->
    <polygon points="80,80 160,80 120,160" fill="#84cc16"/>
    <!-- Triangle Pointing Down (Pale Green / Yellow-Green) -->
    <polygon points="160,80 200,160 120,160" fill="#bef264"/>
  </g>

  <!-- Right Half: Orange and Blue (Shifted Down and Right) -->
  <g transform="translate(30, 30)">
    <!-- Orange Top-Right Parallelogram -->
    <!-- Triangle Pointing Up (Light Orange) -->
    <polygon points="120,0 200,0 160,80" fill="#fb923c"/>
    <!-- Triangle Pointing Down (Dark Orange) -->
    <polygon points="200,0 240,80 160,80" fill="#ea580c"/>

    <!-- Blue Bottom-Right Parallelogram -->
    <!-- Triangle Pointing Up (Teal / Blue-Teal) -->
    <polygon points="160,80 240,80 200,160" fill="#0e7490"/>
    <!-- Triangle Pointing Down (Dark Navy) -->
    <polygon points="240,80 280,160 200,160" fill="#0f172a"/>
  </g>
</svg>
